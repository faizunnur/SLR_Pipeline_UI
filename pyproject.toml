[project]
name = "slr-pipeline-ui"
version = "1.0.0"
description = "Desktop app for running a systematic literature review end to end: search, dedup, screening, full-text assessment, extraction, PRISMA 2020 figures and an audit trail. A redesigned UI built on slr-pipeline."
readme = "README.md"
requires-python = ">=3.10"
# Covers the Python source and the desktop app's front end (src/) -- README.md,
# docs/ and examples/README.md are separately licensed under CC-BY-4.0; see
# LICENSE-docs and the README's own "## License" section for the split.
license = {file = "LICENSE.txt"}
authors = [{name = "faizunnur"}]
keywords = ["systematic literature review", "PRISMA 2020", "screening", "citation verification", "research software", "desktop app"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "rapidfuzz>=3.6",
    "matplotlib>=3.6",
    "questionary>=2.0",
    "rich>=13.0",
    # The desktop window. Without a native web view (some Linux setups), the
    # same UI still runs with `slr-ui --browser`.
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/faizunnur/SLR_Pipeline_UI"
Changelog = "https://github.com/faizunnur/SLR_Pipeline_UI/blob/main/CHANGELOG.md"
"Original project" = "https://github.com/nayeem-hossain/slr-pipeline"

# `slr-ui` starts the desktop app from a terminal (and is the one to use for
# `--browser` / `--help`, whose output a windowed launcher cannot print on
# Windows). `slr` is the original guided terminal app, kept unchanged: a review
# can be continued in either interface. `src/scripts/<stage>.py` remain
# individually readable and directly runnable, exactly as upstream.
[project.scripts]
slr-ui = "slr_desktop.app:main"
slr = "slr:main"

# Same app, launched without a console window (for a shortcut or the Start menu).
[project.gui-scripts]
slr-desktop = "slr_desktop.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["srp", "scripts", "slr_desktop"]
py-modules = ["slr"]

[tool.setuptools.package-data]
slr_desktop = ["web/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
