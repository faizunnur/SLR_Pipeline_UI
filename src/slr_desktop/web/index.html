<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 'unsafe-eval' is here for the desktop window only: pywebview builds its
       Python bridge with new Function(), and WebKit (macOS, Linux) refuses that
       without it, which left the window blank. Scripts still load from the
       app's own files only, and none of them calls eval. Browser mode sends a
       stricter header without it (server.py). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-eval'; connect-src 'self'">
  <title>SLR Pipeline UI</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <main class="view" id="view"></main>
      <div class="dock hidden" id="dock"></div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts"></div>
  <script src="core.js"></script>
  <script src="views-home.js"></script>
  <script src="views-run.js"></script>
  <script src="views-screen.js"></script>
  <script src="views-outputs.js"></script>
  <script src="main.js"></script>
</body>
</html>
